services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: iocl
      POSTGRES_PASSWORD: iocl_secure_password
      POSTGRES_DB: iocl_gate
    ports:
      - "5432:5432"
    volumes:
      - iocl_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iocl -d iocl_gate"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  iocl_postgres_data:
